version: "3.9"

services:
  etcd:
    image: quay.io/coreos/etcd:v3.6.7
    container_name: etcd
    command:
      - /usr/local/bin/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
    ports:
      - "2379:2379"
    networks:
      - my_net

  etcdv3-browser:
    image: rustyx/etcdv3-browser
    container_name: etcdv3-browser
    ports:
      - "8081:8081"
    environment:
      HTTP_PORT: 8081
      ETCD: etcd:2379
      EDITABLE: "1"
    depends_on:
      - etcd
    networks:
      - my_net

networks:
  my_net:
    driver: bridge